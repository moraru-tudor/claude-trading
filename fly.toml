# Fly.io config: one always-on machine (~$2-4/month) with HTTPS at https://<app>.fly.dev
# Change `app` to a unique name, then follow README → "Phone: run it in the cloud".
app = "my-trading-desk"
primary_region = "iad"

[build]

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  DATA_DIR = "/data"
  MODE = "paper"

# session state (positions, trades, Claude's strategy) survives restarts and deploys
[[mounts]]
  source = "desk_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # a trading bot must never sleep: open positions need their stop-loss checked every second
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
